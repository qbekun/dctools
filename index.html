<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>the wired</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #000000;
      --card: #18181b;
      --card-hover: #1e1e22;
      --border: #27272a;
      --text: #fafafa;
      --text-dim: #a1a1aa;
      --accent: #ffffff;
      --accent-hover: #cccccc;
      --danger: #ed4245;
      --danger-hover: #c03537;
      --success: #57f287;
      --warning: #fee75c;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(14,14,16,.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }
    nav .inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }
    nav .logo {
      font-weight: 700;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    nav .logo svg { width: 22px; height: 22px; fill: var(--accent); }
    nav .links { display: flex; gap: 4px; }
    nav .links button {
      background: none;
      border: none;
      color: var(--text-dim);
      font: inherit;
      font-size: .85rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all .15s;
    }
    nav .links button:hover,
    nav .links button.active {
      color: var(--text);
      background: var(--card);
    }

    /* ── TOOLS GRID ── */
    .tools-grid { display: none; }
    .tool-card {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      cursor: pointer;
      transition: all .2s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
    }
    .tool-card:hover {
      border-color: #fff;
      transform: translateY(-1px);
    }
    .tool-card h3 { font-size: .9rem; font-weight: 500; color: var(--text-dim); text-align: center; }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: rgba(0,0,0,.85);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 28px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 12px; right: 12px;
      background: none; border: none;
      color: var(--text-dim);
      font-size: 1.2rem;
      cursor: pointer;
      width: 28px; height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { color: var(--text); }
    .modal h2 { font-size: 1rem; font-weight: 500; margin-bottom: 20px; color: var(--text-dim); }

    /* ── FORM ── */
    label {
      display: block;
      font-size: .7rem;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    input, textarea, select {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 4px;
      padding: 9px 12px;
      color: var(--text);
      font: inherit;
      font-size: .85rem;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 12px;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #fff;
    }
    textarea { resize: vertical; min-height: 70px; }
    select { cursor: pointer; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 20px;
      border-radius: 4px;
      font: inherit;
      font-size: .85rem;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,.1);
      cursor: pointer;
      transition: all .15s;
      width: 100%;
    }
    .btn-primary {
      background: transparent;
      color: #fff;
      border-color: #fff;
    }
    .btn-primary:hover { background: rgba(255,255,255,.1); }
    .btn-danger {
      background: transparent;
      color: var(--danger);
      border-color: var(--danger);
    }
    .btn-danger:hover { background: rgba(237,66,69,.15); }
    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* ── RESULT ── */
    .result {
      margin-top: 14px;
      background: transparent;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 4px;
      padding: 14px;
      font-size: .8rem;
      line-height: 1.6;
      display: none;
      word-break: break-all;
    }
    .result.show { display: block; }
    .result pre {
      white-space: pre-wrap;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: .8rem;
    }
    .result .success { color: var(--success); }
    .result .error { color: var(--danger); }
    .result .info { color: #fff; }
    .result .warn { color: var(--warning); }

    /* ── PROGRESS ── */
    .progress-bar {
      margin-top: 12px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      display: none;
    }
    .progress-bar.show { display: block; }
    .progress-bar .fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      transition: width .2s;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 32px 20px;
      color: var(--text-dim);
      font-size: .8rem;
      border-top: 1px solid var(--border);
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 20px;
      font-size: .85rem;
      z-index: 300;
      transform: translateY(100px);
      opacity: 0;
      transition: all .3s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* ── SPLASH SCREEN ── */
    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity .6s;
    }
    .splash-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .enter-btn {
      padding: 15px 30px;
      background-color: #000000;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    /* ── BACKGROUND LAYERS ── */
    .bg-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 275px;
      z-index: -1;
      pointer-events: none;
    }
    .bg-layer.pine1 {
      background: url('pine_04.gif');
      animation: slide 240s linear infinite;
    }
    .bg-layer.pine2 {
      background: url('pine_03.gif');
      animation: slide 120s linear infinite;
    }
    .bg-layer.pine3 {
      background: url('pine_02.gif');
      animation: slide 60s linear infinite;
    }
    .bg-layer.pine4 {
      background: url('pine_01.gif');
      animation: slide 30s linear infinite;
    }
    @keyframes slide {
      from { background-position: -1598px; }
      to   { background-position: 1598px; }
    }

    /* ── LAIN GIF ── */
    .bg-lain {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 768px;
      height: 768px;
      margin-top: -500px;
      margin-left: -400px;
      z-index: -1;
      pointer-events: none;
    }

    /* ── SITE CONTENT ── */
    #site-content {
      display: none;
      animation: fadeIn 1s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body bgcolor="#000000" style="margin:0;padding:0">

<!-- SPLASH -->
<div class="splash-screen" id="splash">
  <button class="enter-btn" onclick="showSite()">ENTER</button>
</div>

<!-- BACKGROUND -->
<img class="bg-lain" src="lain.gif" width="768" height="768">
<div class="bg-layer pine1"></div>
<div class="bg-layer pine2"></div>
<div class="bg-layer pine3"></div>
<div class="bg-layer pine4"></div>

<!-- AUDIO -->
<audio id="bgMusic" src="song.mp3" loop></audio>

<!-- SITE CONTENT -->
<div id="site-content">



<!-- TOKEN INPUT -->
<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;width:100%;max-width:420px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;">
  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;">
    <div class="tool-card" onclick="openModal('webhook-sender')">
    <h3>Webhook Sender</h3>
  </div>

  <div class="tool-card" onclick="openModal('webhook-spammer')">
    <h3>Webhook Spammer</h3>
  </div>

  <div class="tool-card" onclick="openModal('webhook-info')">
    <h3>Webhook Info</h3>
  </div>

  <div class="tool-card" onclick="openModal('webhook-remover')">
    <h3>Webhook Remover</h3>
  </div>
  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOverlay(event)">

  <!-- WEBHOOK SENDER -->
  <div class="modal" id="modal-webhook-sender">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h2>Webhook Sender</h2>
    <label>Webhook URL</label>
    <input type="url" id="ws-url" placeholder="https://discord.com/api/webhooks/...">
    <label>Username (optional)</label>
    <input type="text" id="ws-username" placeholder="Custom username">
    <label>Avatar URL (optional)</label>
    <input type="url" id="ws-avatar" placeholder="https://example.com/avatar.png">
    <label>Message</label>
    <textarea id="ws-content" placeholder="Hello from the wired."></textarea>
    <button class="btn btn-primary" onclick="sendWebhook()">Send Message</button>
    <div class="result" id="ws-result"></div>
  </div>

  <!-- WEBHOOK SPAMMER -->
  <div class="modal" id="modal-webhook-spammer">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h2>Webhook Spammer</h2>
    <label>Webhook URL</label>
    <input type="url" id="wk-url" placeholder="https://discord.com/api/webhooks/...">
    <label>Username (optional)</label>
    <input type="text" id="wk-username" placeholder="Custom username">
    <label>Avatar URL (optional)</label>
    <input type="url" id="wk-avatar" placeholder="https://example.com/avatar.png">
    <label>Message</label>
    <textarea id="wk-content" placeholder="Spam message"></textarea>
    <label>Delay (ms)</label>
    <input type="number" id="wk-delay" min="0" max="5000" value="100">
    <button class="btn btn-primary" id="wk-btn" onclick="spamWebhook()">Start Spam</button>
    <div class="progress-bar" id="wk-progress"><div class="fill"></div></div>
    <div class="result" id="wk-result"></div>
  </div>

  <!-- WEBHOOK INFO -->
  <div class="modal" id="modal-webhook-info">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h2>Webhook Info</h2>
    <label>Webhook URL</label>
    <input type="url" id="wi-url" placeholder="https://discord.com/api/webhooks/...">
    <button class="btn btn-primary" onclick="getWebhookInfo()">Get Info</button>
    <div class="result" id="wi-result"></div>
  </div>

  <!-- PROFILE INFO -->
  <!-- WEBHOOK REMOVER -->
  <div class="modal" id="modal-webhook-remover">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h2>Webhook Remover</h2>
    <label>Webhook URL</label>
    <input type="url" id="wr-url" placeholder="https://discord.com/api/webhooks/...">
    <button class="btn btn-danger" onclick="removeWebhook()">Delete Webhook</button>
    <div class="result" id="wr-result"></div>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>



</div><!-- end site-content -->

<script>
// ── SPLASH SCREEN ──
function showSite() {
  const splash = document.getElementById('splash');
  splash.classList.add('hidden');
  document.getElementById('site-content').style.display = 'block';
  setTimeout(() => splash.remove(), 700);
  const music = document.getElementById('bgMusic');
  music.volume = 0.02;
  music.play().catch(() => {});
}

// ── MODAL MANAGEMENT ──
function openModal(id) {
  document.getElementById('modal-overlay').classList.add('open');
  document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
  document.getElementById('modal-' + id).style.display = 'block';
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
function closeModalOverlay(e) {
  if (e.target === e.currentTarget) closeModal();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function scrollToSection(id) {
  document.querySelectorAll('.links button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (id === 'tools') window.scrollTo({ top: 0, behavior: 'smooth' });
  else document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function showResult(id, html) {
  const el = document.getElementById(id);
  el.innerHTML = html;
  el.classList.add('show');
}

function hexToInt(hex) {
  return parseInt(hex.replace('#', ''), 16);
}

// ── WEBHOOK SENDER ──
async function sendWebhook() {
  const url = document.getElementById('ws-url').value.trim();
  const username = document.getElementById('ws-username').value.trim();
  const avatar = document.getElementById('ws-avatar').value.trim();
  const content = document.getElementById('ws-content').value.trim();
  if (!url) return showResult('ws-result', '<span class="error">⚠ Enter a webhook URL.</span>');
  if (!content) return showResult('ws-result', '<span class="error">⚠ Enter a message.</span>');

  const body = { content };
  if (username) body.username = username;
  if (avatar) body.avatar_url = avatar;

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (res.ok || res.status === 204) {
      showResult('ws-result', '<span class="success">✅ Message sent successfully!</span>');
      toast('Message sent!');
    } else {
      const data = await res.json().catch(() => ({}));
      showResult('ws-result', `<span class="error">❌ Error ${res.status}: ${data.message || 'Unknown error'}</span>`);
    }
  } catch (err) {
    showResult('ws-result', `<span class="error">❌ Network error: ${err.message}</span>`);
  }
}

// ── WEBHOOK SPAMMER ──
let spamming = false;
let spamSuccess = 0, spamFail = 0;

async function spamWebhook() {
  if (spamming) {
    spamming = false;
    document.getElementById('wk-btn').textContent = 'Start Spam';
    document.getElementById('wk-btn').classList.remove('btn-danger');
    return;
  }

  const url = document.getElementById('wk-url').value.trim();
  const content = document.getElementById('wk-content').value.trim();
  const username = document.getElementById('wk-username').value.trim();
  const avatar = document.getElementById('wk-avatar').value.trim();
  const delay = parseInt(document.getElementById('wk-delay').value) || 100;

  if (!url) return showResult('wk-result', '<span class="error">⚠ Enter a webhook URL.</span>');
  if (!content) return showResult('wk-result', '<span class="error">⚠ Enter a message.</span>');

  spamming = true;
  spamSuccess = 0;
  spamFail = 0;
  document.getElementById('wk-btn').textContent = 'Stop Spam';
  document.getElementById('wk-btn').classList.add('btn-danger');
  showResult('wk-result', '<span class="info">Spamming... sent: 0 | failed: 0</span>');

  while (spamming) {
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content, ...(username && { username }), ...(avatar && { avatar_url: avatar }) })
      });
      if (res.ok || res.status === 204) spamSuccess++;
      else spamFail++;
    } catch { spamFail++; }
    showResult('wk-result', `<span class="info">Spamming... sent: ${spamSuccess} | failed: ${spamFail}</span>`);
    await new Promise(r => setTimeout(r, delay));
  }

  showResult('wk-result', `<span class="success">✅ Stopped. Sent: ${spamSuccess}</span> <span class="error">Failed: ${spamFail}</span>`);
  toast('Spam stopped!');
}

// ── WEBHOOK INFO ──
async function getWebhookInfo() {
  const url = document.getElementById('wi-url').value.trim();
  if (!url) return showResult('wi-result', '<span class="error">⚠ Enter a webhook URL.</span>');

  try {
    const res = await fetch(url);
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      return showResult('wi-result', `<span class="error">❌ Error ${res.status}: ${data.message || 'Unknown'}</span>`);
    }
    const data = await res.json();
    showResult('wi-result', `<pre><span class="info">Name:</span>    ${data.name || 'N/A'}
<span class="info">ID:</span>       ${data.id}
<span class="info">Token:</span>    ${data.token ? data.token.slice(0, 12) + '...' : 'N/A'}
<span class="info">Channel:</span>  ${data.channel_id || 'N/A'}
<span class="info">Guild:</span>    ${data.guild_id || 'N/A'}
<span class="info">Avatar:</span>   ${data.avatar || 'Default'}
<span class="info">Type:</span>     ${data.type === 0 ? 'Incoming' : 'Follower'}
<span class="info">Created:</span>  ${data.id ? new Date(Number((BigInt(data.id) >> 22n) + 1420070400000n)).toLocaleString() : 'N/A'}</pre>`);
  } catch (err) {
    showResult('wi-result', `<span class="error">❌ Network error: ${err.message}</span>`);
  }
}

// ── PROFILE INFO (via avatar) ──


// ── WEBHOOK REMOVER ──
async function removeWebhook() {
  const url = document.getElementById('wr-url').value.trim();
  if (!url) return showResult('wr-result', '<span class="error">⚠ Enter a webhook URL.</span>');

  try {
    const res = await fetch(url, { method: 'DELETE' });
    if (res.ok || res.status === 204) {
      showResult('wr-result', '<span class="success">✅ Webhook deleted successfully!</span>');
      toast('Webhook deleted!');
    } else {
      const data = await res.json().catch(() => ({}));
      showResult('wr-result', `<span class="error">❌ Error ${res.status}: ${data.message || 'Unknown error'}</span>`);
    }
  } catch (err) {
    showResult('wr-result', `<span class="error">❌ Network error: ${err.message}</span>`);
  }
}
</script>
</body>
</html>
